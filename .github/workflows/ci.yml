name: verify

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build
        run: npm run build

      - name: Lint (oxlint + file size + docs)
        run: npm run lint

      - name: Backend structure (dependency-free)
        run: python scripts/verify-backend-structure.py

      - name: Contract verification
        if: ${{ hashFiles('contracts/**') != '' }}
        run: npm run contracts:check

      - name: Core unit and property tests
        if: ${{ hashFiles('packages/core/**') != '' }}
        run: npm run core:test

      - name: Backend tests
        run: node scripts/python.mjs -m pytest backend/tests -q
        continue-on-error: false

      - name: Bench (executable specification)
        run: node bench/run.mjs

      - name: Playwright
        run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=1

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The end-to-end acceptance suite needs a live model provider and is slow.
    # It runs on demand and on a schedule, never on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Acceptance
        run: npm run acceptance

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: docs/ACCEPTANCE.md
          if-no-files-found: ignore

  schedule:
    - cron: '17 4 * * 1'